<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">OMG Package Manager</title>
  <desc id="description">Stop managing package managers. One CLI for packages, runtimes, and project toolchains.</desc>
  <rect width="1200" height="630" fill="#090909"/>
  <line x1="72" y1="82" x2="1128" y2="82" stroke="#f2f0ea" stroke-opacity="0.22"/>
  <line x1="72" y1="520" x2="1128" y2="520" stroke="#f2f0ea" stroke-opacity="0.22"/>
  <text x="72" y="58" font-family="system-ui, sans-serif" font-size="24" font-weight="750" letter-spacing="-1" fill="#f2f0ea">OMG<tspan fill="#ff5f38">/</tspan></text>
  <text x="1128" y="58" text-anchor="end" font-family="ui-monospace, monospace" font-size="14" fill="#9f9b95">PACKAGE CONTROL / ONE CLI</text>

  <text x="72" y="218" font-family="system-ui, sans-serif" font-size="94" font-weight="700" letter-spacing="-7" fill="#f2f0ea">Stop managing</text>
  <text x="72" y="310" font-family="system-ui, sans-serif" font-size="94" font-weight="700" letter-spacing="-7" fill="#f2f0ea">package managers.</text>
  <text x="76" y="376" font-family="system-ui, sans-serif" font-size="24" fill="#9f9b95">Packages, runtimes, and project toolchains through one Rust CLI.</text>

  <g transform="translate(72 430)">
    <rect width="736" height="56" fill="#111111" stroke="#f2f0ea" stroke-opacity="0.16"/>
    <text x="24" y="35" font-family="ui-monospace, monospace" font-size="17" fill="#ff5f38">$</text>
    <text x="54" y="35" font-family="ui-monospace, monospace" font-size="17" fill="#f2f0ea">omg env check</text>
    <rect x="736" width="320" height="56" fill="#ff5f38"/>
    <text x="1032" y="35" text-anchor="end" font-family="ui-monospace, monospace" font-size="15" font-weight="700" fill="#090909">SAME MACHINE STATE →</text>
  </g>

  <text x="72" y="566" font-family="ui-monospace, monospace" font-size="14" fill="#9f9b95">ARCH · DEBIAN · UBUNTU · MACOS · WINDOWS</text>
  <text x="1128" y="566" text-anchor="end" font-family="ui-monospace, monospace" font-size="14" fill="#ff5f38">getomg.dev</text>
</svg>
