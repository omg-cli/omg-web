name = "omg-saas"
main = "src/worker.ts"
compatibility_date = "2026-08-21"
compatibility_flags = ["nodejs_compat"] # Required for Sentry SDK
workers_dev = false

# Cloudflare Email Sending - native binding, no API key needed.
send_email = [{ name = "EMAIL", allowed_sender_addresses = ["noreply@latham.cloud"] }]

# Custom domain (DNS record is created automatically by Workers Custom Domains).
routes = [{ pattern = "omg-api.latham.cloud", custom_domain = true }]

# The site and SaaS Worker share the final D1 slot available on the Free plan.
# Better Auth owns user/session/account/verification; this Worker owns all other tables.
[[d1_databases]]
binding = "DB"
database_name = "omg-platform"
database_id = "fee8ddab-fb4a-4be4-b8d2-8abb7c2db188"
migrations_dir = "migrations"

# Rate limiting for admin API (100 requests per minute per user)
[[ratelimits]]
name = "ADMIN_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 100, period = 60 }

# Rate limiting for auth API (10 requests per minute per IP - brute force protection)
[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

# Rate limiting for telemetry API (100 events per minute per license)
[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 100, period = 60 }

# Public introductory-offer claims are intentionally much tighter than telemetry.
[[ratelimits]]
name = "OFFER_RATE_LIMITER"
namespace_id = "1004"
simple = { limit = 3, period = 60 }

# Secrets are set via: npx wrangler secret put <NAME>
# Required: STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, JWT_SECRET,
# JWT_PRIVATE_KEY (Ed25519 PKCS#8 PEM), and ADMIN_API_SECRET.
# OTP email uses the EMAIL binding above.
# Optional: TURNSTILE_SECRET_KEY, SENTRY_DSN
# STRIPE_INTRO_COUPON_ID references the server-owned 20%-for-3-months coupon
# restricted to the OMG Pro and Team products.

[observability]
enabled = true
redact_query_string = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 0.01
persist = true

[placement]
mode = "smart"

[version_metadata]
binding = "CF_VERSION_METADATA"

[vars]
STRIPE_PRO_PRICE_ID = "price_1UAvtYEFWzXv59QZgttvSlRI"
STRIPE_TEAM_PRICE_ID = "price_1UAvtZEFWzXv59QZdkZdmcud"
STRIPE_INTRO_COUPON_ID = "omg_intro_20_3mo_v1"

[triggers]
crons = ["0 2 * * *", "*/5 * * * *"]
