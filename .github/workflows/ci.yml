name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref: a merged PR must not keep running its pull_request job
# alongside the push job, racing on shared npm caches.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
            workers/api/package-lock.json
      # Honor the packageManager pin from package.json instead of the runner's stock npm.
      - run: corepack enable npm && npm --version
      - run: npm ci --audit=false
      - run: npm ci --audit=false --prefix site
      - run: npm ci --audit=false --prefix workers/api
      # The deploy dry-run inside check builds the site after cheap deterministic gates.
      - run: npm run check

  e2e-anonymous:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: site/package-lock.json
      # Select the pinned npm before install so its lifecycle-script policy applies.
      - run: corepack enable npm && npm --version
        working-directory: site
      - run: npm ci --audit=false
        working-directory: site
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: site
      - run: npm run test:e2e:public
        working-directory: site
      # This job stays public and local: authenticated specs require a bound
      # deployment and their traces must never become downloadable artifacts.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            site/playwright-report
            site/test-results
          if-no-files-found: ignore
          retention-days: 7
